services:
  postgres:
    image: postgres:16
    container_name: tg_adaptation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tg_adaptation
      POSTGRES_USER: tg_bot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: